name: lab_2
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 1. Launcher icons ka package humne yahan add kar diya
  flutter_launcher_icons: ^0.13.1

# 2. Package ki configuration (Bilkul left line se start hogi bina kisi space ke)
flutter_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.jpg
